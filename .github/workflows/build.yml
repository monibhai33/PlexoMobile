name: Build Plexo Mobile APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android Project
        run: python3 -c 'import os,shutil;shutil.rmtree("app",ignore_errors=True);os.makedirs("app/src/main/java/com/plexo/mobile",exist_ok=True);open("gradle.properties","w").write("org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\n");open("settings.gradle.kts","w").write("pluginManagement {\n repositories {\n google()\n mavenCentral()\n gradlePluginPortal()\n }\n}\ndependencyResolutionManagement {\n repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n repositories {\n google()\n mavenCentral()\n }\n}\nrootProject.name = \x22PlexoMobile\x22\ninclude(\x22\x3aapp\x22)\n");open("build.gradle.kts","w").write("plugins {\n id(\x22com.android.application\x22) version \x228.5.0\x22 apply false\n id(\x22org.jetbrains.kotlin.android\x22) version \x221.9.24\x22 apply false\n}\n");open("app/build.gradle.kts","w").write("plugins {\n id(\x22com.android.application\x22)\n id(\x22org.jetbrains.kotlin.android\x22)\n}\nandroid {\n namespace = \x22com.plexo.mobile\x22\n compileSdk = 34\n defaultConfig {\n applicationId = \x22com.plexo.mobile\x22\n minSdk = 26\n targetSdk = 34\n versionCode = 1\n versionName = \x221.0\x22\n }\n compileOptions {\n sourceCompatibility = JavaVersion.VERSION_17\n targetCompatibility = JavaVersion.VERSION_17\n }\n kotlinOptions {\n jvmTarget = \x2217\x22\n }\n}\n");open("app/src/main/AndroidManifest.xml","w").write("<?xml version=\x221.0\x22 encoding=\x22utf-8\x22?>\n<manifest xmlns\x3aandroid=\x22http\x3a//schemas.android.com/apk/res/android\x22>\n <uses-permission android\x3aname=\x22android.permission.INTERNET\x22 />\n <uses-permission android\x3aname=\x22android.permission.ACCESS_NETWORK_STATE\x22 />\n <uses-permission android\x3aname=\x22android.permission.CHANGE_NETWORK_STATE\x22 />\n <application android\x3aallowBackup=\x22true\x22 android\x3aicon=\x22@android\x3adrawable/stat_sys_download\x22 android\x3alabel=\x22Plexo Mobile\x22 android\x3ausesCleartextTraffic=\x22true\x22 android\x3atheme=\x22@android\x3astyle/Theme.DeviceDefault.NoActionBar\x22>\n <activity android\x3aname=\x22.MainActivity\x22 android\x3aexported=\x22true\x22>\n <intent-filter>\n <action android\x3aname=\x22android.intent.action.MAIN\x22 />\n <category android\x3aname=\x22android.intent.category.LAUNCHER\x22 />\n </intent-filter>\n </activity>\n </application>\n</manifest>\n");open("app/src/main/java/com/plexo/mobile/MainActivity.kt","w").write("package com.plexo.mobile\nimport android.app.Activity\nimport android.content.Context\nimport android.graphics.Color\nimport android.graphics.Typeface\nimport android.graphics.drawable.GradientDrawable\nimport android.net.*\nimport android.os.*\nimport android.widget.*\nimport java.io.*\nimport java.net.*\nimport java.util.concurrent.Executors\nimport java.util.concurrent.atomic.*\nclass MainActivity \x3a Activity() {\n private lateinit var cm\x3a ConnectivityManager\n @Volatile private var wifiNet\x3a Network? = null\n @Volatile private var cellNet\x3a Network? = null\n private val ui = Handler(Looper.getMainLooper())\n private val pool = Executors.newCachedThreadPool()\n private val active = AtomicBoolean(false)\n private val paused = AtomicBoolean(false)\n override fun onCreate(savedInstanceState\x3a Bundle?) {\n super.onCreate(savedInstanceState)\n cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager\n val scroll = ScrollView(this).apply { setBackgroundColor(Color.parseColor(\x22\x23121212\x22)); isFillViewport = true }\n val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 64, 48, 64) }\n val title = TextView(this).apply { text = \x22Plexo Mobile\x22; textSize = 26f; setTypeface(null, Typeface.BOLD); setTextColor(Color.WHITE) }\n val sub = TextView(this).apply { text = \x22Wi-Fi + 5G/4G Multi-Network Booster\x22; textSize = 14f; setTextColor(Color.GRAY); setPadding(0, 8, 0, 40) }\n val wifiTv = TextView(this).apply { text = \x22Wi-Fi\x3a Waiting... | 0 KB/s\x22; textSize = 15f; setTextColor(Color.parseColor(\x22\x234CAF50\x22)); setPadding(0, 0, 0, 16) }\n val cellTv = TextView(this).apply { text = \x22Mobile Data\x3a Waiting... | 0 KB/s\x22; textSize = 15f; setTextColor(Color.parseColor(\x22\x232196F3\x22)); setPadding(0, 0, 0, 24) }\n val totTv = TextView(this).apply { text = \x22Combined Speed\x3a 0 KB/s\x22; textSize = 19f; setTypeface(null, Typeface.BOLD); setTextColor(Color.parseColor(\x22\x23FFC107\x22)) }\n val card = LinearLayout(this).apply {\n orientation = LinearLayout.VERTICAL; setPadding(40, 40, 40, 40)\n background = GradientDrawable().apply { setColor(Color.parseColor(\x22\x231E1E1E\x22)); cornerRadius = 28f }\n addView(wifiTv); addView(cellTv); addView(totTv)\n }\n val lp = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 36 }\n val bindBtn = Button(this).apply {\n text = \x221. Activate Wi-Fi + Mobile Data\x22\n setOnClickListener {\n val wReq = NetworkRequest.Builder().addTransportType(NetworkCapabilities.TRANSPORT_WIFI).addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET).build()\n val cReq = NetworkRequest.Builder().addTransportType(NetworkCapabilities.TRANSPORT_CELLULAR).addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET).build()\n cm.requestNetwork(wReq, object \x3a ConnectivityManager.NetworkCallback() {\n override fun onAvailable(n\x3a Network) { wifiNet = n; ui.post { wifiTv.text = \x22Wi-Fi\x3a Connected | 0 KB/s\x22 } }\n })\n cm.requestNetwork(cReq, object \x3a ConnectivityManager.NetworkCallback() {\n override fun onAvailable(n\x3a Network) { cellNet = n; ui.post { cellTv.text = \x22Mobile Data\x3a Connected | 0 KB/s\x22 } }\n })\n }\n }\n val urlBox = EditText(this).apply {\n hint = \x22Paste Direct File URL (https\x3a//...)\x22\n setText(\x22https\x3a//ash-speed.hetzner.com/100MB.bin\x22)\n setTextColor(Color.WHITE); setHintTextColor(Color.GRAY); setSingleLine(true)\n }\n val bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply { max = 100; progress = 0 }\n val statusTv = TextView(this).apply { text = \x22Ready to download\x22; textSize = 14f; setTextColor(Color.WHITE); setPadding(0, 16, 0, 36) }\n val startBtn = Button(this).apply {\n text = \x222. Start Boosted Download\x22\n setOnClickListener {\n val u = urlBox.text.toString().trim()\n if (u.isNotEmpty() && !active.get()) { paused.set(false); startDownload(u, wifiTv, cellTv, totTv, bar, statusTv) }\n }\n }\n val stopBtn = Button(this).apply {\n text = \x22Pause / Stop\x22\n setOnClickListener { paused.set(true); active.set(false); statusTv.text = \x22Download Paused\x22 }\n }\n root.addView(title); root.addView(sub); root.addView(card, lp); root.addView(bindBtn, lp)\n root.addView(urlBox, lp); root.addView(bar, lp); root.addView(statusTv); root.addView(startBtn, lp); root.addView(stopBtn, lp)\n scroll.addView(root); setContentView(scroll)\n }\n private fun startDownload(urlStr\x3a String, wTv\x3a TextView, cTv\x3a TextView, tTv\x3a TextView, bar\x3a ProgressBar, sTv\x3a TextView) {\n active.set(true)\n pool.execute {\n try {\n ui.post { sTv.text = \x22Connecting to server...\x22 }\n val nets = listOfNotNull(wifiNet, cellNet)\n val hConn = (if (nets.isNotEmpty()) nets.first().openConnection(URL(urlStr)) else URL(urlStr).openConnection()) as HttpURLConnection\n hConn.requestMethod = \x22HEAD\x22; hConn.connectTimeout = 15000\n val total = hConn.contentLengthLong; hConn.disconnect()\n if (total <= 0L) { ui.post { sTv.text = \x22Server does not support parallel chunks or invalid link.\x22 }; active.set(false); return@execute }\n val name = urlStr.substringBefore(\x22?\x22).substringAfterLast(\x22/\x22).ifBlank { \x22plexo_file.bin\x22 }\n val out = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), name)\n RandomAccessFile(out, \x22rw\x22).use { it.setLength(total) }\n val wBytes = AtomicLong(0); val cBytes = AtomicLong(0); val allBytes = AtomicLong(0)\n pool.execute {\n var lw = 0L; var lc = 0L\n while (active.get() && !paused.get()) {\n Thread.sleep(1000)\n val cw = wBytes.get(); val cc = cBytes.get()\n val ws = (cw - lw) / 1024; val cs = (cc - lc) / 1024\n lw = cw; lc = cc\n val pct = ((allBytes.get() * 100) / total).toInt().coerceIn(0, 100)\n ui.post {\n wTv.text = \x22Wi-Fi\x3a Active | \x22 + ws + \x22 KB/s\x22\n cTv.text = \x22Mobile Data\x3a Active | \x22 + cs + \x22 KB/s\x22\n tTv.text = \x22Combined Speed\x3a \x22 + (ws + cs) + \x22 KB/s\x22\n bar.progress = pct\n sTv.text = pct.toString() + \x22% • Downloading 8 parallel chunks...\x22\n }\n }\n }\n val chunks = 8; val cSize = total / chunks\n val futures = (0 until chunks).map { i ->\n pool.submit {\n val s = i * cSize\n val e = if (i == chunks - 1) total - 1 else (s + cSize - 1)\n val useW = (i % 2 == 0 && wifiNet != null) || cellNet == null\n val net = if (useW) wifiNet else cellNet\n val conn = (if (net != null) net.openConnection(URL(urlStr)) else URL(urlStr).openConnection()) as HttpURLConnection\n conn.setRequestProperty(\x22Range\x22, \x22bytes=\x22 + s + \x22-\x22 + e)\n conn.connectTimeout = 20000; conn.readTimeout = 20000\n conn.inputStream.use { inp ->\n RandomAccessFile(out, \x22rw\x22).use { raf ->\n raf.seek(s)\n val buf = ByteArray(8192)\n var r\x3a Int\n while (inp.read(buf).also { r = it } != -1 && !paused.get()) {\n raf.write(buf, 0, r)\n allBytes.addAndGet(r.toLong())\n if (useW) wBytes.addAndGet(r.toLong()) else cBytes.addAndGet(r.toLong())\n }\n }\n }\n conn.disconnect()\n }\n }\n futures.forEach { it.get() }\n if (!paused.get()) { active.set(false); ui.post { bar.progress = 100; sTv.text = \x22Done! Saved in Downloads/\x22 + name } }\n } catch (ex\x3a Exception) { active.set(false); ui.post { sTv.text = \x22Error\x3a \x22 + ex.localizedMessage } }\n }\n }\n}\n")'
      
      - name: Apply Plexo App Icon
        run: |
          pip install pillow

          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable

          python3 - <<'PY'
          from PIL import Image
          import os

          img = Image.open("assets/ic_launcher.png").convert("RGBA")
          px = img.load()

          for y in range(img.height):
              for x in range(img.width):
                  r, g, b, a = px[x, y]
                  if max(r, g, b) < 22:
                      px[x, y] = (0, 0, 0, 0)

          bbox = img.getbbox()
          if bbox:
              img = img.crop(bbox)

          size = 432
          img.thumbnail((290, 290), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          canvas.alpha_composite(
              img, ((size-img.width)//2, (size-img.height)//2)
          )
          canvas.save("app/src/main/res/drawable/ic_launcher_foreground.png")

          for folder, dim in [
              ("mipmap-mdpi", 48),
              ("mipmap-hdpi", 72),
              ("mipmap-xhdpi", 96),
              ("mipmap-xxhdpi", 144),
              ("mipmap-xxxhdpi", 192)
          ]:
              icon = Image.open("assets/ic_launcher.png").convert("RGB")
              icon.thumbnail((dim, dim), Image.Resampling.LANCZOS)
              bg = Image.new("RGB", (dim, dim), "black")
              bg.paste(icon, ((dim-icon.width)//2, (dim-icon.height)//2))
              bg.save(f"app/src/main/res/{folder}/ic_launcher.png")
          PY

          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#000000"/>
          </shape>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          sed -i 's|@android:drawable/stat_sys_download|@mipmap/ic_launcher|' app/src/main/AndroidManifest.xml
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Plexo-Mobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
