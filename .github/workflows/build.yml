name: Build Plexo Mobile APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Android Project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          mkdir -p app/src/main/java/com/plexo/mobile

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PlexoMobile"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.plexo.mobile"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.plexo.mobile"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 6
                  versionName = "1.5"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/stat_sys_download"
                  android:label="Plexo Mobile"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <service
                      android:name=".DownloadKeepAliveService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/plexo/mobile/MainActivity.kt <<'KOTLIN'
          package com.plexo.mobile

          import android.app.Activity
          import android.app.AlertDialog
          import android.app.Service
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.os.IBinder
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.ConnectivityManager
          import android.net.Network
          import android.net.NetworkCapabilities
          import android.net.NetworkRequest
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.webkit.CookieManager
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.WebChromeClient
          import android.webkit.DownloadListener
          import android.text.InputType
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.TextView
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.io.IOException
          import java.io.RandomAccessFile
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Callable
          import java.util.concurrent.Executors
          import java.util.concurrent.Future
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicLong
          import java.util.Locale

          class MainActivity : Activity() {
              private lateinit var cm: ConnectivityManager
              @Volatile private var wifiNet: Network? = null
              @Volatile private var cellNet: Network? = null
              private var wifiCallback: ConnectivityManager.NetworkCallback? = null
              private var cellCallback: ConnectivityManager.NetworkCallback? = null
              private val ui = Handler(Looper.getMainLooper())
              private val active = AtomicBoolean(false)
              private val stopped = AtomicBoolean(false)
              private val worker = Executors.newSingleThreadExecutor()
              private lateinit var wifiTv: TextView
              private lateinit var cellTv: TextView
              private lateinit var totalTv: TextView
              private lateinit var statusTv: TextView
              private lateinit var bar: ProgressBar
              private lateinit var urlBox: EditText
              private lateinit var wifiChunksBox: EditText
              private lateinit var cellChunksBox: EditText
              private lateinit var threadCountBox: EditText
              private lateinit var startBtn: Button
              private lateinit var activateBtn: Button
              private lateinit var stopBtn: Button
              private var networksRequested = false
              private val wifiByteCounter = AtomicLong(0L)
              private val cellByteCounter = AtomicLong(0L)
              private val speedLock = Any()
              private var lastSpeedAt = 0L
              private var lastWifiBytes = 0L
              private var lastCellBytes = 0L

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 2303)
                  }
                  cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(Color.rgb(18, 18, 18))
                      isFillViewport = true
                  }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(28, 36, 28, 36)
                  }
                  root.addView(label("Plexo Mobile", 28f, Color.WHITE, true))
                  root.addView(label("Wi-Fi + 5G/4G Multi-Network Booster", 14f, Color.LTGRAY))

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(22, 22, 22, 22)
                      background = rounded(Color.rgb(30, 30, 30), 24f)
                  }
                  wifiTv = label("Wi-Fi: Waiting... | 0 KB/s", 15f, Color.rgb(76, 175, 80))
                  cellTv = label("Mobile Data: Waiting... | 0 KB/s", 15f, Color.rgb(33, 150, 243))
                  totalTv = label("Combined Speed: 0 KB/s", 19f, Color.rgb(255, 193, 7), true)
                  card.addView(wifiTv)
                  card.addView(cellTv)
                  card.addView(totalTv)
                  root.addView(card, params(18))

                  activateBtn = button("1. Activate Wi-Fi + Mobile Data", Color.rgb(90, 90, 90))
                  activateBtn.setOnClickListener {
                      requestNetworks()
                      networksRequested = true
                      activateBtn.background = rounded(Color.rgb(0, 200, 83), 18f)
                      activateBtn.setTextColor(Color.BLACK)
                      statusTv.text = "Checking Wi-Fi and mobile data networks..."
                  }
                  root.addView(activateBtn, params(18))

                  root.addView(label("Manual download settings (maximum 32 threads)", 15f, Color.WHITE, true))
                  val settingsRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }
                  fun numberBox(hintText: String, value: String): EditText = EditText(this).apply {
                      hint = hintText
                      setText(value)
                      inputType = InputType.TYPE_CLASS_NUMBER
                      textSize = 14f
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.LTGRAY)
                      setPadding(10, 8, 10, 8)
                  }
                  wifiChunksBox = numberBox("Wi-Fi chunks", "4")
                  cellChunksBox = numberBox("Mobile chunks", "4")
                  threadCountBox = numberBox("Threads (max 32)", "8")
                  settingsRow.addView(wifiChunksBox, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  settingsRow.addView(cellChunksBox, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  settingsRow.addView(threadCountBox, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  root.addView(settingsRow, params(10))

                  urlBox = EditText(this).apply {
                      hint = "Paste a direct HTTP/HTTPS file URL"
                      setText("https://sabnzbd.org/tests/internetspeed/10MB.bin")
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.GRAY)
                      textSize = 15f
                      setSingleLine(true)
                      setPadding(20, 18, 20, 18)
                      // Keep the platform EditText underline, like the original interface.
                  }
                  root.addView(urlBox, params(8))
                  val browserBtn = button("Open in-app browser", Color.rgb(65, 65, 65))
                  browserBtn.setOnClickListener { openInAppBrowser() }
                  root.addView(browserBtn, params(16))

                  bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100
                      progress = 0
                  }
                  root.addView(bar, params(10))
                  statusTv = label("Ready to download", 13f, Color.WHITE)
                  root.addView(statusTv, params(14))

                  startBtn = button("2. Start Boosted Download", Color.rgb(90, 90, 90))
                  startBtn.setOnClickListener {
                      startBtn.background = rounded(Color.rgb(0, 200, 83), 18f)
                      startBtn.setTextColor(Color.BLACK)
                      beginDownload()
                  }
                  root.addView(startBtn, params(14))

                  stopBtn = button("Pause / Stop", Color.rgb(211, 47, 47))
                  stopBtn.setOnClickListener {
                      if (active.get()) {
                          stopped.set(true)
                          stopBtn.background = rounded(Color.rgb(0, 200, 83), 18f)
                          stopBtn.setTextColor(Color.BLACK)
                          statusTv.text = "Stopping download..."
                      } else {
                          stopped.set(true)
                          stopBtn.background = rounded(Color.rgb(211, 47, 47), 18f)
                          stopBtn.setTextColor(Color.WHITE)
                          statusTv.text = "No active download."
                      }
                  }
                  root.addView(stopBtn)

                  scroll.addView(root)
                  setContentView(scroll)
                  refreshNetworkStatus()
              }

              private fun label(text: String, size: Float, color: Int, bold: Boolean = false) =
                  TextView(this).apply {
                      this.text = text
                      textSize = size
                      setTextColor(color)
                      if (bold) setTypeface(null, Typeface.BOLD)
                      setPadding(0, 0, 0, 12)
                  }

              private fun rounded(color: Int, radius: Float, stroke: Int? = null) =
                  GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = radius
                      if (stroke != null) setStroke(2, stroke)
                  }

              private fun button(text: String, color: Int) = Button(this).apply {
                  this.text = text
                  textSize = 14f
                  setTypeface(null, Typeface.BOLD)
                  setTextColor(Color.WHITE)
                  isAllCaps = false
                  background = rounded(color, 18f)
              }

              private fun params(bottom: Int) =
                  LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { bottomMargin = bottom }

              private fun refreshNetworkStatus() {
                  val network = cm.activeNetwork
                  val caps = network?.let { cm.getNetworkCapabilities(it) }
                  if (caps?.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) == true) {
                      wifiTv.text = "Wi-Fi: Connected"
                  }
                  if (caps?.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) == true) {
                      cellTv.text = "Mobile Data: Connected"
                  }
              }

              private fun requestNetworks() {
                  try {
                      val wifiRequest = NetworkRequest.Builder()
                          .addTransportType(NetworkCapabilities.TRANSPORT_WIFI)
                          .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET).build()
                      val cellRequest = NetworkRequest.Builder()
                          .addTransportType(NetworkCapabilities.TRANSPORT_CELLULAR)
                          .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET).build()
                      if (wifiCallback == null) {
                          wifiCallback = object : ConnectivityManager.NetworkCallback() {
                              override fun onAvailable(network: Network) {
                                  wifiNet = network
                                  ui.post {
                                      wifiTv.text = "Wi-Fi: Connected | 0 KB/s"
                                      if (networksRequested) {
                                          activateBtn.background = rounded(Color.rgb(0, 200, 83), 18f)
                                          activateBtn.setTextColor(Color.BLACK)
                                      }
                                  }
                              }
                              override fun onLost(network: Network) {
                                  if (wifiNet == network) wifiNet = null
                                  ui.post { wifiTv.text = "Wi-Fi: Not available" }
                              }
                          }
                          cm.requestNetwork(wifiRequest, wifiCallback!!)
                      }
                      if (cellCallback == null) {
                          cellCallback = object : ConnectivityManager.NetworkCallback() {
                              override fun onAvailable(network: Network) {
                                  cellNet = network
                                  ui.post { cellTv.text = "Mobile Data: Connected" }
                              }
                              override fun onLost(network: Network) {
                                  if (cellNet == network) cellNet = null
                                  ui.post { cellTv.text = "Mobile Data: Not available" }
                              }
                          }
                          cm.requestNetwork(cellRequest, cellCallback!!)
                      }
                      statusTv.text = "Checking available networks..."
                  } catch (e: Exception) {
                      statusTv.text = "Network setup error: ${e.localizedMessage ?: "unknown"}"
                  }
              }

              private fun configuredChunkCounts(): Pair<Int, Int> {
                  val wifiCount = wifiChunksBox.text.toString().toIntOrNull()?.coerceIn(0, 32) ?: 0
                  val cellCount = cellChunksBox.text.toString().toIntOrNull()?.coerceIn(0, 32) ?: 0
                  if (wifiCount + cellCount !in 1..32) {
                      throw IllegalArgumentException("Set Wi-Fi + Mobile chunks to a total between 1 and 32.")
                  }
                  return wifiCount to cellCount
              }

              private fun configuredThreadCount(chunkTotal: Int): Int {
                  return (threadCountBox.text.toString().toIntOrNull() ?: chunkTotal).coerceIn(1, 32).coerceAtMost(chunkTotal)
              }

              private fun openInAppBrowser() {
                  val prefs = getSharedPreferences("plexo_browser", Context.MODE_PRIVATE)
                  var desktopMode = false

                  val browserLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(10, 10, 10, 10)
                      setBackgroundColor(Color.rgb(18, 20, 24))
                  }

                  val address = EditText(this).apply {
                      hint = "Google खोजें या वेबसाइट का पता लिखें"
                      setSingleLine(true)
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.LTGRAY)
                      setPadding(12, 8, 12, 8)
                      setText(urlBox.text.toString().trim().takeIf {
                          it.startsWith("http://", true) || it.startsWith("https://", true)
                      } ?: "https://www.google.com")
                  }

                  fun makeButton(text: String, color: Int = Color.rgb(45, 48, 55)) =
                      Button(this).apply {
                          this.text = text
                          isAllCaps = false
                          setTextColor(Color.WHITE)
                          background = rounded(color, 10f)
                          textSize = 12f
                          setPadding(6, 2, 6, 2)
                      }

                  val addressRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val goButton = makeButton("खोलें", Color.rgb(35, 105, 190))
                  addressRow.addView(address, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  addressRow.addView(goButton, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  val rowOne = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val backButton = makeButton("←")
                  val forwardButton = makeButton("→")
                  val reloadButton = makeButton("↻")
                  val homeButton = makeButton("होम")
                  val bookmarkButton = makeButton("☆")
                  for (b in listOf(backButton, forwardButton, reloadButton, homeButton, bookmarkButton)) {
                      rowOne.addView(b, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  }

                  val rowTwo = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val findButton = makeButton("पेज में खोजें")
                  val desktopButton = makeButton("Desktop")
                  val shareButton = makeButton("Share")
                  val bookmarksButton = makeButton("Bookmarks")
                  for (b in listOf(findButton, desktopButton, shareButton, bookmarksButton)) {
                      rowTwo.addView(b, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  }

                  val progress = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100
                      progress = 0
                  }
                  val titleView = TextView(this).apply {
                      text = "Plexo Browser"
                      textSize = 12f
                      setTextColor(Color.LTGRAY)
                      setPadding(4, 3, 4, 6)
                  }

                  val web = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.loadsImagesAutomatically = true
                      settings.javaScriptCanOpenWindowsAutomatically = false
                      settings.setSupportMultipleWindows(false)
                      settings.builtInZoomControls = true
                      settings.displayZoomControls = false
                      settings.allowFileAccess = false
                      settings.allowContentAccess = true
                      CookieManager.getInstance().setAcceptCookie(true)
                      if (Build.VERSION.SDK_INT >= 21) {
                          CookieManager.getInstance().setAcceptThirdPartyCookies(this, true)
                      }
                      webViewClient = object : WebViewClient() {
                          override fun onPageStarted(view: WebView?, url: String?, favicon: android.graphics.Bitmap?) {
                              super.onPageStarted(view, url, favicon)
                              progress.visibility = android.view.View.VISIBLE
                              titleView.text = "पेज लोड हो रहा है…"
                              if (!url.isNullOrBlank()) address.setText(url)
                          }

                          override fun onPageFinished(view: WebView?, url: String?) {
                              super.onPageFinished(view, url)
                              titleView.text = view?.title ?: "Plexo Browser"
                              if (!url.isNullOrBlank()) address.setText(url)
                              progress.visibility = android.view.View.GONE
                              backButton.isEnabled = canGoBack()
                              forwardButton.isEnabled = canGoForward()
                          }
                      }
                      webChromeClient = object : WebChromeClient() {
                          override fun onProgressChanged(view: WebView?, newProgress: Int) {
                              progress.progress = newProgress
                              progress.visibility = if (newProgress >= 100) android.view.View.GONE else android.view.View.VISIBLE
                          }
                          override fun onReceivedTitle(view: WebView?, title: String?) {
                              titleView.text = title ?: "Plexo Browser"
                          }
                      }

                      // Automatically start the SAME existing downloader when a website starts a file download.
                      // This preserves beginDownload() -> performDownload() and its current chunk/resume/background logic.
                      setDownloadListener(DownloadListener { downloadUrl, _, contentDisposition, mimeType, _ ->
                          runOnUiThread {
                              if (downloadUrl.startsWith("http://", true) ||
                                  downloadUrl.startsWith("https://", true)) {
                                  urlBox.setText(downloadUrl)
                                  statusTv.text = "Website download detected. Starting Plexo downloader…"
                                  beginDownload()
                              } else {
                                  statusTv.text = "यह वेबसाइट का डाउनलोड लिंक WebView के सीधे डाउनलोडर से समर्थित नहीं है: $downloadUrl"
                                  AlertDialog.Builder(this@MainActivity)
                                      .setTitle("यह डाउनलोड लिंक समर्थित नहीं है")
                                      .setMessage("Plexo का मौजूदा डाउनलोडर सीधे HTTP/HTTPS फ़ाइल लिंक स्वीकार करता है। Blob, data या JavaScript-आधारित डाउनलोड के लिए अलग सहायता चाहिए।")
                                      .setPositiveButton("ठीक है", null)
                                      .show()
                              }
                          }
                      })
                  }

                  val mobileUserAgent = web.settings.userAgentString

                  fun navigate(raw: String) {
                      val typed = raw.trim()
                      if (typed.isBlank()) {
                          address.error = "वेबसाइट या खोज लिखें"
                          return
                      }
                      val hasScheme = typed.startsWith("http://", true) || typed.startsWith("https://", true)
                      val looksLikeDomain = typed.matches(
                          Regex("(?i)^[a-z0-9.-]+\\.[a-z]{2,}(:[0-9]{1,5})?(/.*)?$")
                      )
                      val target = when {
                          hasScheme -> typed
                          looksLikeDomain -> "https://$typed"
                          else -> "https://www.google.com/search?q=" +
                              java.net.URLEncoder.encode(typed, "UTF-8")
                      }
                      web.loadUrl(target)
                  }

                  goButton.setOnClickListener { navigate(address.text.toString()) }
                  address.setOnEditorActionListener { _, _, _ ->
                      navigate(address.text.toString())
                      true
                  }
                  backButton.setOnClickListener { if (web.canGoBack()) web.goBack() }
                  forwardButton.setOnClickListener { if (web.canGoForward()) web.goForward() }
                  reloadButton.setOnClickListener {
                      if (progress.visibility == android.view.View.VISIBLE) web.stopLoading() else web.reload()
                  }
                  homeButton.setOnClickListener { web.loadUrl("https://www.google.com") }
                  bookmarkButton.setOnClickListener {
                      val current = web.url ?: address.text.toString()
                      val saved = prefs.getStringSet("bookmarks", emptySet())?.toMutableSet() ?: mutableSetOf()
                      saved.add(current)
                      prefs.edit().putStringSet("bookmarks", saved).apply()
                      bookmarkButton.text = "★"
                      android.widget.Toast.makeText(this, "बुकमार्क सेव हो गया", android.widget.Toast.LENGTH_SHORT).show()
                  }
                  bookmarksButton.setOnClickListener {
                      val saved = prefs.getStringSet("bookmarks", emptySet())?.toList()?.sorted() ?: emptyList()
                      if (saved.isEmpty()) {
                          AlertDialog.Builder(this).setMessage("अभी कोई बुकमार्क सेव नहीं है। ☆ दबाकर वेबसाइट सेव करें।")
                              .setPositiveButton("ठीक है", null).show()
                      } else {
                          AlertDialog.Builder(this).setTitle("बुकमार्क")
                              .setItems(saved.toTypedArray()) { _, which -> navigate(saved[which]) }
                              .setNegativeButton("बंद करें", null).show()
                      }
                  }
                  findButton.setOnClickListener {
                      val field = EditText(this).apply {
                          hint = "इस पेज पर शब्द खोजें"
                          setSingleLine(true)
                      }
                      AlertDialog.Builder(this).setTitle("पेज में खोजें").setView(field)
                          .setPositiveButton("खोजें") { _, _ -> web.findAllAsync(field.text.toString()) }
                          .setNeutralButton("खोज साफ़ करें") { _, _ -> web.clearMatches() }
                          .setNegativeButton("रद्द करें", null).show()
                  }
                  desktopButton.setOnClickListener {
                      desktopMode = !desktopMode
                      web.settings.userAgentString = if (desktopMode) {
                          "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                      } else {
                          mobileUserAgent
                      }
                      desktopButton.text = if (desktopMode) "Mobile" else "Desktop"
                      web.reload()
                  }
                  shareButton.setOnClickListener {
                      val current = web.url ?: address.text.toString()
                      startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).apply {
                          type = "text/plain"
                          putExtra(Intent.EXTRA_TEXT, current)
                      }, "लिंक शेयर करें"))
                  }

                  val sendToDownloader = makeButton("इस पेज का URL पुराने डाउनलोडर में भेजें", Color.rgb(0, 135, 70))
                  browserLayout.addView(addressRow)
                  browserLayout.addView(rowOne)
                  browserLayout.addView(rowTwo)
                  browserLayout.addView(progress, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 5))
                  browserLayout.addView(titleView)
                  browserLayout.addView(web, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  browserLayout.addView(sendToDownloader)

                  val dialog = AlertDialog.Builder(this)
                      .setTitle("Plexo Browser")
                      .setView(browserLayout)
                      .setNegativeButton("ब्राउज़र बंद करें", null)
                      .create()
                  sendToDownloader.setOnClickListener {
                      urlBox.setText(web.url ?: address.text.toString())
                      statusTv.text = "ब्राउज़र का URL पुराने डाउनलोडर में भेज दिया गया है। डाउनलोड शुरू करने के लिए Start Boosted Download दबाएँ।"
                      dialog.dismiss()
                  }
                  dialog.setOnDismissListener {
                      web.stopLoading()
                      web.destroy()
                  }
                  dialog.show()
                  dialog.window?.setLayout(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  )
                  navigate(address.text.toString())
              }
              private fun beginDownload() {
                  val text = urlBox.text.toString().trim()
                  val parsed = try { URL(text) } catch (_: Exception) { null }
                  if (parsed == null || (parsed.protocol != "http" && parsed.protocol != "https")) {
                      statusTv.text = "Enter a valid direct HTTP/HTTPS file URL."
                      return
                  }
                  try {
                      val (wifiCount, cellCount) = configuredChunkCounts()
                      configuredThreadCount(wifiCount + cellCount)
                  } catch (e: Exception) {
                      statusTv.text = e.message ?: "Invalid chunk settings."
                      return
                  }
                  if (!active.compareAndSet(false, true)) {
                      statusTv.text = "A download is already running."
                      return
                  }
                  stopped.set(false)
                  bar.progress = 0
                  try {
                      val serviceIntent = Intent(this, DownloadKeepAliveService::class.java).apply {
                          action = DownloadKeepAliveService.ACTION_START
                          putExtra(DownloadKeepAliveService.EXTRA_TITLE, "Plexo Mobile download")
                          putExtra(DownloadKeepAliveService.EXTRA_TEXT, "Preparing download…")
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(serviceIntent)
                      else startService(serviceIntent)
                  } catch (_: Exception) {
                      statusTv.text = "Could not start background download service."
                  }
                  startBtn.isEnabled = false
                  startBtn.background = rounded(Color.rgb(0, 200, 83), 18f)
                  startBtn.setTextColor(Color.BLACK)
                  stopBtn.background = rounded(Color.rgb(0, 200, 83), 18f)
                  stopBtn.setTextColor(Color.BLACK)
                  worker.execute {
                      try {
                          performDownload(text)
                      } catch (e: Exception) {
                          ui.post {
                              statusTv.text = if (stopped.get()) "Download stopped."
                              else "Download error: ${e.message ?: e.javaClass.simpleName}"
                          }
                      } finally {
                          active.set(false)
                          try {
                              stopService(Intent(this@MainActivity, DownloadKeepAliveService::class.java))
                          } catch (_: Exception) {}
                          ui.post {
                              startBtn.isEnabled = true
                              startBtn.background = rounded(Color.rgb(90, 90, 90), 18f)
                              startBtn.setTextColor(Color.WHITE)
                              stopBtn.background = rounded(Color.rgb(211, 47, 47), 18f)
                              stopBtn.setTextColor(Color.WHITE)
                          }
                      }
                  }
              }

              private fun connection(url: String, network: Network?): HttpURLConnection {
                  val c = (network?.openConnection(URL(url)) ?: URL(url).openConnection()) as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 25000
                  c.instanceFollowRedirects = true
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36")
                  val cookie = try { CookieManager.getInstance().getCookie(url) } catch (_: Exception) { null }
                  if (!cookie.isNullOrBlank()) c.setRequestProperty("Cookie", cookie)
                  return c
              }

              private fun performDownload(url: String) {
                  val parsed = URL(url)
                  val fileName = parsed.path.substringAfterLast('/')
                      .ifBlank { "plexo-download.bin" }
                      .replace(Regex("[^A-Za-z0-9._-]"), "_")
                  val key = url.hashCode().toUInt().toString(16)
                  val workDir = File(cacheDir, "plexo-resume-$key").apply { mkdirs() }
                  val meta = File(workDir, "source.url")
                  if (meta.exists() && meta.readText() != url) {
                      workDir.deleteRecursively()
                      workDir.mkdirs()
                  }
                  meta.writeText(url)

                  val probe = connection(url, wifiNet ?: cellNet)
                  var total = -1L
                  var supportsRanges = false
                  try {
                      probe.setRequestProperty("Range", "bytes=0-0")
                      val code = probe.responseCode
                      val cr = probe.getHeaderField("Content-Range") ?: ""
                      val match = Regex("bytes\\s+0-0/(\\d+)", RegexOption.IGNORE_CASE).find(cr)
                      if (code == HttpURLConnection.HTTP_PARTIAL && match != null) {
                          total = match.groupValues[1].toLongOrNull() ?: -1L
                          supportsRanges = total > 0L
                      } else if (code in 200..299) {
                          total = probe.contentLengthLong
                      } else {
                          throw IOException("Server returned HTTP $code. Check the direct file URL.")
                      }
                  } finally {
                      probe.disconnect()
                  }

                  ui.post {
                      statusTv.text = "Preparing ${configuredChunkCounts().let { it.first + it.second }}-part download with up to ${configuredThreadCount(configuredChunkCounts().let { it.first + it.second })} threads..."
                      wifiByteCounter.set(0L)
                      cellByteCounter.set(0L)
                      lastSpeedAt = System.currentTimeMillis()
                      lastWifiBytes = 0L
                      lastCellBytes = 0L
                  }

                  val assembled = File(workDir, "complete.part")
                  if (supportsRanges && total > 0L) {
                      downloadChunksResumable(url, workDir, total)
                      if (stopped.get()) {
                          ui.post { statusTv.text = "Paused. Press Start to resume the saved parts." }
                          return
                      }
                      RandomAccessFile(assembled, "rw").use { output ->
                          output.setLength(total)
                          val (wifiCount, cellCount) = configuredChunkCounts()
                          val count = wifiCount + cellCount
                          val chunkSize = (total + count - 1L) / count
                          for (i in 0 until count) {
                              val chunkStart = i * chunkSize
                              if (chunkStart >= total) continue
                              val expected = minOf(chunkSize, total - chunkStart)
                              val part = File(workDir, "chunk-$i.part")
                              if (!part.exists() || part.length() != expected) {
                                  throw IOException("Part ${i + 1}/$count is incomplete; press Start to retry.")
                              }
                              FileInputStream(part).use { input ->
                                  output.seek(chunkStart)
                                  input.copyTo(object : java.io.OutputStream() {
                                      override fun write(b: Int) { output.write(b) }
                                      override fun write(b: ByteArray, off: Int, len: Int) { output.write(b, off, len) }
                                  })
                              }
                          }
                      }
                  } else {
                      // Some servers reject Range requests; use a resumable single stream instead.
                      downloadSingleResumable(url, assembled)
                      if (stopped.get()) {
                          ui.post { statusTv.text = "Paused at ${formatSize(assembled.length())}. Press Start to resume." }
                          return
                      }
                  }

                  if (stopped.get()) return
                  if (!assembled.exists() || assembled.length() <= 0L) {
                      throw IOException("The server returned an empty file.")
                  }
                  val location = saveToDownloads(assembled, fileName)
                  workDir.deleteRecursively()
                  ui.post {
                      bar.progress = 100
                      totalTv.text = "Combined Speed: 0 KB/s"
                      statusTv.text = "Complete! Saved to $location"
                  }
              }

              private fun downloadChunksResumable(url: String, workDir: File, total: Long) {
                  val (wifiChunkCount, cellChunkCount) = configuredChunkCounts()
                  val count = wifiChunkCount + cellChunkCount
                  val threadCount = configuredThreadCount(count)
                  val chunkSize = (total + count - 1L) / count
                  // User-controlled split: first N chunks prefer Wi-Fi, remaining chunks prefer mobile data.
                  val wifiAvailable = wifiNet
                  val cellAvailable = cellNet
                  val executor = Executors.newFixedThreadPool(threadCount)
                  val futures = ArrayList<Future<*>>()
                  val done = AtomicLong(0L)
                  val initial = (0 until count).sumOf { i ->
                      val start = i * chunkSize
                      if (start >= total) 0L else File(workDir, "chunk-$i.part").takeIf { it.exists() }?.length() ?: 0L
                  }
                  done.set(initial.coerceAtMost(total))
                  try {
                      for (i in 0 until count) {
                          val start = i * chunkSize
                          if (start >= total) continue
                          val end = minOf(total - 1L, start + chunkSize - 1L)
                          val expected = end - start + 1L
                          val part = File(workDir, "chunk-$i.part")
                          if (part.exists() && part.length() == expected) continue

                          futures.add(executor.submit(Callable {
                              var offset = if (part.exists()) part.length() else 0L
                              if (offset > expected) {
                                  part.delete()
                                  offset = 0L
                              }
                              val selected = if (i < wifiChunkCount) {
                                  wifiAvailable ?: cellAvailable
                              } else {
                                  cellAvailable ?: wifiAvailable
                              }
                              if (selected == null) {
                                  throw IOException("No usable network. Press Activate Wi-Fi + Mobile Data first.")
                              }
                              val useWifi = wifiAvailable != null && selected == wifiAvailable
                              var c = connection(url, selected)
                              try {
                                  if (offset > 0L) c.setRequestProperty("Range", "bytes=${start + offset}-$end")
                                  else c.setRequestProperty("Range", "bytes=$start-$end")
                                  var code = c.responseCode
                                  if (code != HttpURLConnection.HTTP_PARTIAL) {
                                      throw IOException("Server does not support byte-range chunks; use a direct download link that supports Range.")
                                  }
                                  val cr = c.getHeaderField("Content-Range") ?: ""
                                  val m = Regex("bytes\\s+(\\d+)-(\\d+)/(\\d+)", RegexOption.IGNORE_CASE).find(cr)
                                  if (m == null || m.groupValues[1].toLong() != start + offset ||
                                      m.groupValues[2].toLong() != end || m.groupValues[3].toLong() != total) {
                                      throw IOException("Server returned an invalid byte range for part ${i + 1}.")
                                  }

                                  val started = System.currentTimeMillis()
                                  FileOutputStream(part, offset > 0L).use { output ->
                                      c.inputStream.use { input ->
                                          val buffer = ByteArray(32 * 1024)
                                          while (!stopped.get() && !Thread.currentThread().isInterrupted) {
                                              val n = input.read(buffer)
                                              if (n < 0) break
                                              output.write(buffer, 0, n)
                                              done.addAndGet(n.toLong())
                                              if (useWifi) wifiByteCounter.addAndGet(n.toLong())
                                              else if (selected != null) cellByteCounter.addAndGet(n.toLong())
                                              updateNetworkProgress(done.get(), total, started)
                                          }
                                      }
                                  }
                                  if (!stopped.get() && part.length() != expected) {
                                      throw IOException("Part ${i + 1} incomplete. Press Start to resume.")
                                  }
                              } finally {
                                  c.disconnect()
                              }
                          }))
                      }
                      futures.forEach { it.get() }
                      if (stopped.get()) throw IOException("Download paused.")
                  } catch (e: Exception) {
                      executor.shutdownNow()
                      executor.awaitTermination(10, TimeUnit.SECONDS)
                      throw e
                  } finally {
                      executor.shutdownNow()
                  }
              }

              private fun updateNetworkProgress(done: Long, total: Long, started: Long) {
                  val now = System.currentTimeMillis()
                  synchronized(speedLock) {
                      if (now - lastSpeedAt >= 700L) {
                          val wifiNow = wifiByteCounter.get()
                          val cellNow = cellByteCounter.get()
                          val elapsed = maxOf(1L, now - lastSpeedAt)
                          val wifiSpeed = maxOf(0L, (wifiNow - lastWifiBytes) * 1000L / elapsed / 1024L)
                          val cellSpeed = maxOf(0L, (cellNow - lastCellBytes) * 1000L / elapsed / 1024L)
                          lastSpeedAt = now
                          lastWifiBytes = wifiNow
                          lastCellBytes = cellNow
                          val combined = wifiSpeed + cellSpeed
                          DownloadKeepAliveService.update(
                              this@MainActivity,
                              "Downloading • ${if (total > 0L) ((done * 100L) / total).coerceIn(0L, 100L) else 0L}%",
                              "${formatSize(done.coerceAtMost(total))} / ${formatSize(total)} • ${formatSpeed(combined)}"
                          )
                          ui.post {
                              wifiTv.text = "Wi-Fi: ${if (wifiNet != null) "Connected" else "Unavailable"} | ${formatSpeed(wifiSpeed)}"
                              cellTv.text = "Mobile Data: ${if (cellNet != null) "Connected" else "Unavailable"} | ${formatSpeed(cellSpeed)}"
                              totalTv.text = "Combined Speed: ${formatSpeed(combined)}"
                              if (total > 0L) {
                                  bar.progress = ((done * 100L) / total).toInt().coerceIn(0, 100)
                                  statusTv.text = "${bar.progress}% • ${formatSize(done.coerceAtMost(total))}/${formatSize(total)} • Avg ${formatSpeed(done * 1000L / maxOf(1L, now - started) / 1024L)}"
                              }
                          }
                      }
                  }
              }

              private fun downloadSingleResumable(url: String, temp: File) {
                  var offset = if (temp.exists()) temp.length() else 0L
                  var c = connection(url, wifiNet ?: cellNet)
                  var total = -1L
                  var append = false
                  val selected = wifiNet ?: cellNet
                  val useWifi = selected != null && selected == wifiNet
                  try {
                      if (offset > 0L) c.setRequestProperty("Range", "bytes=$offset-")
                      val code = c.responseCode
                      if (offset > 0L && code == HttpURLConnection.HTTP_PARTIAL) {
                          val cr = c.getHeaderField("Content-Range") ?: ""
                          val m = Regex("bytes\\s+(\\d+)-(\\d+)/(\\d+|\\*)", RegexOption.IGNORE_CASE).find(cr)
                          if (m != null && m.groupValues[1].toLongOrNull() == offset) {
                              total = m.groupValues[3].toLongOrNull() ?: -1L
                              append = true
                          } else {
                              c.disconnect()
                              temp.delete()
                              offset = 0L
                              c = connection(url, wifiNet ?: cellNet)
                          }
                      } else if (offset > 0L) {
                          c.disconnect()
                          temp.delete()
                          offset = 0L
                          c = connection(url, wifiNet ?: cellNet)
                      }
                      if (offset == 0L) {
                          val freshCode = if (c == null) 0 else c.responseCode
                          if (freshCode !in 200..299) throw IOException("Server returned HTTP $freshCode.")
                          total = c.contentLengthLong
                      }
                      val started = System.currentTimeMillis()
                      var received = offset
                      FileOutputStream(temp, append).use { output ->
                          c.inputStream.use { input ->
                              val buffer = ByteArray(32 * 1024)
                              while (!stopped.get()) {
                                  val n = input.read(buffer)
                                  if (n < 0) break
                                  output.write(buffer, 0, n)
                                  received += n
                                  if (useWifi) wifiByteCounter.addAndGet(n.toLong())
                                  else if (selected != null) cellByteCounter.addAndGet(n.toLong())
                                  updateNetworkProgress(received, total, started)
                              }
                          }
                      }
                      if (!stopped.get() && total > 0L && received != total) {
                          throw IOException("Download ended early ($received of $total bytes). Press Start to retry.")
                      }
                  } finally {
                      c.disconnect()
                  }
              }

              private fun downloadSingle(url: String, temp: File) {
                  val c = connection(url, wifiNet ?: cellNet)
                  try {
                      c.requestMethod = "GET"
                      val code = c.responseCode
                      if (code !in 200..299) throw IOException("Server returned HTTP $code. Check the URL.")
                      val total = c.contentLengthLong
                      val started = System.currentTimeMillis()
                      var received = 0L
                      FileOutputStream(temp, false).use { output ->
                          c.inputStream.use { input ->
                              val buffer = ByteArray(32 * 1024)
                              while (!stopped.get()) {
                                  val n = input.read(buffer)
                                  if (n < 0) break
                                  output.write(buffer, 0, n)
                                  received += n
                                  updateProgress(received, total, started)
                              }
                          }
                      }
                      if (!stopped.get() && total > 0L && received != total) {
                          throw IOException("Download ended before the full file arrived. Retry.")
                      }
                  } finally {
                      c.disconnect()
                  }
              }

              private fun formatSpeed(speedKBps: Long): String {
                  return if (speedKBps >= 1024L) {
                      String.format(Locale.US, "%.2f MB/s", speedKBps / 1024.0)
                  } else {
                      "$speedKBps KB/s"
                  }
              }

              private fun formatSize(bytes: Long): String {
                  val kb = bytes / 1024.0
                  return if (kb >= 1024.0) {
                      String.format(Locale.US, "%.2f MB", kb / 1024.0)
                  } else {
                      String.format(Locale.US, "%.0f KB", kb)
                  }
              }

              private fun updateProgress(done: Long, total: Long, started: Long) {
                  val elapsed = maxOf(1L, System.currentTimeMillis() - started)
                  val speedKBps = done * 1000L / elapsed / 1024L
                  val speedText = formatSpeed(speedKBps)
                  ui.post {
                      if (total > 0L) {
                          bar.progress = ((done * 100L) / total).toInt().coerceIn(0, 100)
                          statusTv.text = "${bar.progress}% • ${formatSize(done)}/${formatSize(total)} • Avg $speedText"
                      } else {
                          statusTv.text = "${formatSize(done)} downloaded • Avg $speedText"
                      }
                      totalTv.text = "Download speed: $speedText"
                  }
              }

              private fun saveToDownloads(source: File, name: String): String {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val values = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                          put(MediaStore.MediaColumns.MIME_TYPE, "application/octet-stream")
                          put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                          put(MediaStore.MediaColumns.IS_PENDING, 1)
                      }
                      val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                          ?: throw IOException("Could not create file in Downloads.")
                      try {
                          val out = contentResolver.openOutputStream(uri)
                              ?: throw IOException("Could not open Downloads output.")
                          out.use { output -> FileInputStream(source).use { it.copyTo(output) } }
                          val done = ContentValues().apply {
                              put(MediaStore.MediaColumns.IS_PENDING, 0)
                          }
                          contentResolver.update(uri, done, null, null)
                          return "Downloads/$name"
                      } catch (e: Exception) {
                          contentResolver.delete(uri, null, null)
                          throw e
                      }
                  }
                  val folder = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS)
                      ?: throw IOException("External storage is unavailable.")
                  if (!folder.exists()) folder.mkdirs()
                  val target = File(folder, name)
                  FileInputStream(source).use { input ->
                      FileOutputStream(target).use { output -> input.copyTo(output) }
                  }
                  return target.absolutePath
              }

              override fun onDestroy() {
                  wifiCallback?.let { try { cm.unregisterNetworkCallback(it) } catch (_: Exception) {} }
                  cellCallback?.let { try { cm.unregisterNetworkCallback(it) } catch (_: Exception) {} }
                  worker.shutdownNow()
                  super.onDestroy()
              }
          }

          class DownloadKeepAliveService : Service() {
              companion object {
                  const val ACTION_START = "com.plexo.mobile.action.START_DOWNLOAD"
                  const val EXTRA_TITLE = "title"
                  const val EXTRA_TEXT = "text"
                  private const val CHANNEL_ID = "plexo_downloads"
                  private const val NOTIFICATION_ID = 2301

                  fun update(context: Context, title: String, text: String) {
                      val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      createChannel(manager)
                      manager.notify(NOTIFICATION_ID, buildNotification(context, title, text))
                  }

                  private fun createChannel(manager: NotificationManager) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val channel = NotificationChannel(
                              CHANNEL_ID, "Plexo downloads", NotificationManager.IMPORTANCE_LOW
                          ).apply { description = "Ongoing Plexo Mobile download progress" }
                          manager.createNotificationChannel(channel)
                      }
                  }

                  private fun buildNotification(context: Context, title: String, text: String): Notification {
                      val openIntent = context.packageManager.getLaunchIntentForPackage(context.packageName)
                      val pending = if (openIntent != null) {
                          PendingIntent.getActivity(
                              context, 2302, openIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT or
                                  (if (Build.VERSION.SDK_INT >= 23) PendingIntent.FLAG_IMMUTABLE else 0)
                          )
                      } else null
                      val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          Notification.Builder(context, CHANNEL_ID)
                      } else {
                          @Suppress("DEPRECATION")
                          Notification.Builder(context)
                      }
                      builder.setSmallIcon(android.R.drawable.stat_sys_download)
                          .setContentTitle(title)
                          .setContentText(text)
                          .setStyle(Notification.BigTextStyle().bigText(text))
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                      if (pending != null) builder.setContentIntent(pending)
                      return builder.build()
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  createChannel(manager)
                  startForeground(NOTIFICATION_ID, buildNotification(this, "Plexo Mobile", "Preparing download…"))
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val title = intent?.getStringExtra(EXTRA_TITLE) ?: "Plexo Mobile download"
                  val text = intent?.getStringExtra(EXTRA_TEXT) ?: "Download running in background"
                  update(this, title, text)
                  return START_STICKY
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          KOTLIN

      - name: Apply Plexo App Icon
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable

          python3 - <<'PY'
          from PIL import Image
          import os

          source = "assets/ic_launcher.png"
          if not os.path.isfile(source):
              raise SystemExit("Missing assets/ic_launcher.png")
          original = Image.open(source).convert("RGBA")
          foreground = original.copy()
          px = foreground.load()
          for y in range(foreground.height):
              for x in range(foreground.width):
                  r, g, b, a = px[x, y]
                  if max(r, g, b) < 22:
                      px[x, y] = (0, 0, 0, 0)
          bbox = foreground.getbbox()
          if bbox:
              foreground = foreground.crop(bbox)
          foreground.thumbnail((240, 240), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          canvas.alpha_composite(foreground, ((432 - foreground.width) // 2, (432 - foreground.height) // 2))
          canvas.save("app/src/main/res/drawable/ic_launcher_foreground.png")

          for folder, dim in [
              ("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96),
              ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192)
          ]:
              icon = original.copy().convert("RGB")
              icon.thumbnail((dim, dim), Image.Resampling.LANCZOS)
              bg = Image.new("RGB", (dim, dim), (0, 0, 0))
              bg.paste(icon, ((dim - icon.width) // 2, (dim - icon.height) // 2))
              bg.save(f"app/src/main/res/{folder}/ic_launcher.png")

          with open("app/src/main/res/drawable/ic_launcher_background.xml", "w") as f:
              f.write('<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#000000"/></shape>')

          with open("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", "w") as f:
              f.write('<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>')

          manifest = "app/src/main/AndroidManifest.xml"
          text = open(manifest, encoding="utf-8").read()
          text = text.replace(
              'android:icon="@android:drawable/stat_sys_download"',
              'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"'
          )
          open(manifest, "w", encoding="utf-8").write(text)
          PY

